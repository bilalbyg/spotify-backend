server:
  port: 8082

spring:
  application:
    name: library-service
  datasource:
    url: jdbc:postgresql://localhost:5432/spotify_catalog
    username: spotify_user
    password: spotify_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

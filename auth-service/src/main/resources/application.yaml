server:
  port: 8082

spring:
  application:
    name: auth-service
  profiles:
    active: dev
#    active: docker

  datasource:
    url: jdbc:postgresql://localhost:5432/spotify_auth
    username: spotify_user
    password: spotify_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
services:
  postgres:
    image: postgres:15-alpine
    container_name: spotify-postgres
    environment:
      POSTGRES_USER: CHANGE_ME_POSTGRES_USER
      POSTGRES_PASSWORD: CHANGE_ME_POSTGRES_PASSWORD
      POSTGRES_DB: CHANGE_ME_POSTGRES_DB
    ports:
      - "54321:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - spotify-network

  auth-mysql:
    image: mysql:8.0
    container_name: spotify-auth-mysql
    environment:
      MYSQL_DATABASE: CHANGE_ME_MYSQL_DATABASE
      MYSQL_USER: CHANGE_ME_MYSQL_USER
      MYSQL_PASSWORD: CHANGE_ME_MYSQL_PASSWORD
      MYSQL_ROOT_PASSWORD: CHANGE_ME_MYSQL_ROOT_PASSWORD
    ports:
      - "3307:3306"
    volumes:
      - auth_mysql_data:/var/lib/mysql
    networks:
      - spotify-network

  mongodb:
    image: mongo:6.0
    container_name: spotify-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: CHANGE_ME_MONGO_ROOT_USERNAME
      MONGO_INITDB_ROOT_PASSWORD: CHANGE_ME_MONGO_ROOT_PASSWORD
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - spotify-network
    profiles:
      - manual

  redis:
    image: redis:7-alpine
    container_name: spotify-redis
    ports:
      - "6379:6379"
    networks:
      - spotify-network
    profiles:
      - manual

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: spotify-kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: CHANGE_ME_KAFKA_CLUSTER_ID
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - spotify-network
    profiles:
      - manual

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: spotify-kafka-ui
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=CHANGE_ME_CLUSTER_NAME
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      - kafka
    networks:
      - spotify-network
    profiles:
      - manual

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: spotify-zipkin
    ports:
      - "9411:9411"
    networks:
      - spotify-network
    profiles:
      - manual

  minio:
    image: minio/minio:RELEASE.2024-01-28T22-35-53Z
    container_name: spotify-minio
    ports:
      - "9005:9000"
      - "9006:9001"
    environment:
      MINIO_ROOT_USER: CHANGE_ME_MINIO_ROOT_USER
      MINIO_ROOT_PASSWORD: CHANGE_ME_MINIO_ROOT_PASSWORD
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - spotify-network
    profiles:
      - manual

networks:
  spotify-network:
    driver: bridge

volumes:
  postgres_data:
  auth_mysql_data:
  mongodb_data:
  kafka_data:
  minio_data:

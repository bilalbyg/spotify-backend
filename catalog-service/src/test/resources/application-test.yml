# Test profile overrides for the catalog-service context test.
#
# Loaded via @ActiveProfiles("test"). The datasource is repointed to an
# in-memory H2 instance running in PostgreSQL-compat mode so the catalog
# schema (see catalog-service/src/main/resources/application.yml) boots
# unchanged. The application YAML still points at the real PostgreSQL
# service for every non-test profile.

spring:
  datasource:
    url: jdbc:h2:mem:spotify_catalog_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        # H2 understands PostgreSQL SQL well enough for our JPA mappings; the
        # dialect flag lets Hibernate emit the right dialect-specific SQL.
        dialect: org.hibernate.dialect.H2Dialect

application:
  security:
    jwt:
      # 64-byte base64 fixture — non-secret, only used to boot the context
      # in tests. Production reads this from the JWT_SECRET_KEY env var.
      secret-key: dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItbG9jYWwtc3ByaW5nLWJvb3QtYXBwbGljYXRpb25z

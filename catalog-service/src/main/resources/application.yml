server:
  address: 0.0.0.0
  port: 8081
spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: catalog-service

  # Veritabanı Ayarları
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/spotify_catalog}
    username: ${SPRING_DATASOURCE_USERNAME:spotify_catalog_user}
    password: ${SPRING_DATASOURCE_PASSWORD:spotify_catalog_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Çeviri Dosyaları
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # KAFKA AYARLARI (İşte burası 'spring:' in hemen altında olmalı)
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
  # MinIO Object Storage Ayarları
minio:
  url: ${MINIO_URL:http://localhost:9005}
  public-url: ${MINIO_PUBLIC_URL:http://localhost:9005}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET_NAME:spotify-files}

application:
  security:
    jwt:
      # Token doğrulaması için secret key değeri sadece ortam değişkeninden okunur.
      secret-key: ${JWT_SECRET_KEY}

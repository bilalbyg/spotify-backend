server:
  port: 8081

spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: catalog-service

  # Veritabanı Ayarları
  datasource:
    url: jdbc:postgresql://localhost:5433/spotify_catalog
    username: spotify_catalog_user
    password: spotify_catalog_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Çeviri Dosyaları
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # KAFKA AYARLARI (İşte burası 'spring:' in hemen altında olmalı)
  kafka:
    bootstrap-servers: localhost:9094
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
  # MinIO Object Storage Ayarları
minio:
  url: http://localhost:9005 # API portumuz (Arayüz olan 9006 değil!)
  access-key: minioadmin
  secret-key: minioadmin
  bucket-name: spotify-files

application:
  security:
    jwt:
      # Token doğrulaması için secret key değeri sadece ortam değişkeninden okunur.
      secret-key: ${JWT_SECRET_KEY}

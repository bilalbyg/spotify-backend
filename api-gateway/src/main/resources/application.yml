server:
  port: 9000
  address: 0.0.0.0

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        # Catalog Service Yönlendirmesi
        - id: catalog-service-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/catalog/** # Gelen istek bu path ile başlıyorsa catalog-service'e gönder

        # Library Service Yönlendirmesi
        - id: library-service-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/library/** # Gelen istek bu path ile başlıyorsa library-service'e gönder

        # YENİ EKLENEN: MinIO (Dosya Sunucusu) Yönlendirmesi
        - id: minio-route
          uri: http://localhost:9005 # ⚠️ DİKKAT: Buradaki 9005'i MinIO'nun gerçek API portu ile değiştirmelisin!
          predicates:
            - Path=/spotify-files/** # Gelen istek spotify-files ile başlıyorsa MinIO'ya gönder

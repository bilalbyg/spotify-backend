server:
  port: 9000

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        # Catalog Service Yönlendirmesi
        - id: catalog-service-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/catalog/** # Gelen istek bu path ile ba?l?yorsa catalog-service'e gönder
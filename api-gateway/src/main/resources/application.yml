server:
  port: 8084
  address: 0.0.0.0

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            # Phase 0 hardening: replace wildcard origins with an explicit
            # whitelist driven by ALLOWED_ORIGINS (comma-separated). Defaults
            # match the local Jenkins/Vite ports so a fresh checkout still works
            # without extra setup. Override ALLOWED_ORIGINS in prod.
            allowedOrigins: ${ALLOWED_ORIGINS:http://localhost:3001,http://localhost:3002}
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        # Auth Service Yönlendirmesi
        - id: auth-service-route
          uri: ${AUTH_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/auth/**

        # Catalog Service Yönlendirmeleri
        - id: catalog-songs-route
          uri: ${CATALOG_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/songs/**
        - id: catalog-artists-route
          uri: ${CATALOG_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/artists/**
        - id: catalog-albums-route
          uri: ${CATALOG_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/albums/**
        - id: catalog-playlists-route
          uri: ${CATALOG_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/playlists/**
        - id: catalog-podcasts-route
          uri: ${CATALOG_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/podcasts/**
        - id: catalog-episodes-route
          uri: ${CATALOG_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/episodes/**
        - id: catalog-genres-route
          uri: ${CATALOG_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/genres/**
        - id: catalog-lyrics-route
          uri: ${CATALOG_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/lyrics/**

        # MinIO (Dosya Sunucusu) Yönlendirmesi
        - id: minio-route
          uri: ${MINIO_SERVICE_URL:http://localhost:9005}
          predicates:
            - Path=/spotify-files/**

        # Jam WebSocket (STOMP) — terminate edilir, JWT upgrade'de doğrulanır (ADR-002)
        - id: jam-ws-route
          uri: ${CATALOG_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/ws/jam/**

        # Jam session lifecycle (REST)
        - id: jam-sessions-route
          uri: ${CATALOG_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/jam/**

application:
  security:
    jwt:
      # auth-service ile paylaşılan HMAC secret (base64). REST'te downstream
      # doğrular; burada yalnızca WebSocket upgrade'i doğrulanır.
      secret-key: ${JWT_SECRET_KEY}
